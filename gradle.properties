# Gradle / Android settings for the MC Command Simulator Android shell.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# Keep the build working when the checkout lives under a non-ASCII path (for example a
# Chinese folder name on Windows): AGP's path check refuses those by default, while the
# build itself is fine because the JVM runs with -Dfile.encoding=UTF-8 above.
android.overridePathCheck=true

# The WebView shell only ships the zh/en UI strings.
android.injected.testOnly=false
